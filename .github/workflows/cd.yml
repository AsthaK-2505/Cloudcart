name: CloudCart CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy CloudCart with Helm
        run: |
          helm upgrade --install cloudcart-ghcr ./helm \
            -n cloudcart-ghcr \
            --create-namespace \
            --set namespace=cloudcart-ghcr \
            --set tag=${{ github.sha }}

      - name: Check rollout
        run: |
          kubectl rollout status deployment/api-gateway \
            -n cloudcart-ghcr \
            --timeout=180s

      - name: Show pods
        run: |
          kubectl get pods -n cloudcart-ghcr
