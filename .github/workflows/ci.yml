name: CloudCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-gateway/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run automated tests
        run: |
          pytest -v tests/


  build-and-push:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: ${{ matrix.service }}
        run: |
          python -m compileall .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/asthak-2505/cloudcart-${{ matrix.service }}:${{ github.sha }} \
            -t ghcr.io/asthak-2505/cloudcart-${{ matrix.service }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push \
            ghcr.io/asthak-2505/cloudcart-${{ matrix.service }}:${{ github.sha }}

          docker push \
            ghcr.io/asthak-2505/cloudcart-${{ matrix.service }}:latest
